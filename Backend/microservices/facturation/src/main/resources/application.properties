spring.application.name=facturation
# Service
server.port=8083
# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Exposer les endpoints health, info et metrics (seul health l'est par défaut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le détail des composants dans /health (db, diskSpace, ping…)
management.endpoint.health.show-details=always
# Variante : afficher les composants sans leurs détails
#management.endpoint.health.show-components=always
# Transmettre à Eureka le statut de /health (Job passe DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
# Publier les propriétés info.* dans /actuator/info (désactivé par défaut)
management.info.env.enabled=true
# Contenu affiché par /actuator/info
info.app.name=facturation
info.app.version=1.0.0
info.app.description=Microservice de gestion de la facturation

# --- MySQL (facturation_db) ---

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/facturation_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Stocker les UUID en texte lisible (et non en binaire) dans MySQL
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
spring.web.error.include-message=always