# Application
spring.application.name=ApiGatway

# Port du Gateway
server.port=8089

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always


# Route dynamique vers le microservice RISQUES
spring.cloud.gateway.server.webmvc.routes[0].id=risques-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://RISQUES
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/risks/alerts/**