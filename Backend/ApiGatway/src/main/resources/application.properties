spring.application.name=gateway
server.port=8087

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=entreprise-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ENTREPRISE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/entreprise/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1