# Route vers NOTIFICATIONS
spring.cloud.gateway.server.webmvc.routes[3].id=notifications-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://NOTIFICATIONS
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/notifications/**

# Circuit Breaker - NOTIFICATIONS
resilience4j.circuitbreaker.instances.notificationsCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.notificationsCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.notificationsCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationsCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationsCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notificationsCB.permitted-number-of-calls-in-half-open-state=3


# Circuit Breaker - NOTIFICATIONS
spring.cloud.gateway.server.webmvc.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.id=notificationsCB
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.fallbackUri=forward:/fallback/notifications

