# Application
spring.application.name=gateway
server.port=8087

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always

# Weighted Load Balancer
spring.cloud.loadbalancer.configurations=weighted

# Route vers RISQUES
spring.cloud.gateway.server.webmvc.routes[0].id=risques-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://RISQUES
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/risks/alerts/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=risquesCB
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/risques

# Route vers ENTREPRISE
spring.cloud.gateway.server.webmvc.routes[1].id=entreprise-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ENTREPRISE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/entreprise/api/companies,/entreprise/api/companies/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[1].filters[1]=CircuitBreaker=entrepriseCB

# Resilience4j - RISQUES
resilience4j.circuitbreaker.instances.risquesCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.risquesCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.risquesCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.risquesCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.risquesCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.risquesCB.permitted-number-of-calls-in-half-open-state=3

# Circuit Breaker - RISQUES

spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=risquesCB
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/risques
# Circuit Breaker - Entreprise


# Circuit Breaker - facturation
# Route vers FACTURATION (resolue par Eureka grace au nom du service)
spring.cloud.gateway.server.webmvc.routes[2].id=facturation-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://FACTURATION
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/invoices/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.id=facturationCB
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.fallbackUri=forward:/fallback/facturation

# Circuit Breaker facturationCB (valeurs du document : fenetre 10, 50 %, 10 s, delai 2 s)
resilience4j.circuitbreaker.instances.facturationCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.facturationCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.facturationCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.facturationCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.facturationCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.facturationCB.permitted-number-of-calls-in-half-open-state=3


# Circuit Breaker - tresorerie


# Circuit Breaker - Notification
# Resilience4j - ENTREPRISE
resilience4j.circuitbreaker.instances.entrepriseCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.entrepriseCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.entrepriseCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.entrepriseCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.entrepriseCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.entrepriseCB.permitted-number-of-calls-in-half-open-state=3
