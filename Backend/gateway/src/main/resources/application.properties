# Application
spring.application.name=gateway

# Port du Gateway
server.port=8087

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always

# Weighted Load Balancer
spring.cloud.loadbalancer.configurations=weighted

# Route vers RISQUES
spring.cloud.gateway.server.webmvc.routes[0].id=risques-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://RISQUES
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/risks/alerts/**


# Resilience4j - Circuit Breaker

#Circuit Breaker analyse les appels selon leur nombre
resilience4j.circuitbreaker.instances.risquesCB.sliding-window-type=COUNT_BASED
#Il analyse les 5 derniers appels
resilience4j.circuitbreaker.instances.risquesCB.sliding-window-size=5
#Il faut au minimum 5 appels avant de pouvoir calculer le taux d'échec et décider d'ouvrir le Circuit Breaker
resilience4j.circuitbreaker.instances.risquesCB.minimum-number-of-calls=5
#C'est le seuil de déclenchement : 50 % d'échecs.
resilience4j.circuitbreaker.instances.risquesCB.failure-rate-threshold=50
#Une fois le Circuit Breaker ouvert, il attend 10 secondes avant de passer en HALF-OPEN.
resilience4j.circuitbreaker.instances.risquesCB.wait-duration-in-open-state=10s
#Après les 10 secondes, il autorise 3 appels de test vers MS.
resilience4j.circuitbreaker.instances.risquesCB.permitted-number-of-calls-in-half-open-state=3

# Circuit Breaker - RISQUES

spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=risquesCB
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/risques
